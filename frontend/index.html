<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A clearer view of your finances. Track expenses, understand credit, and explore financial insights with FinSight AI." />
    <meta name="theme-color" content="#163d35" />
    <title>FinSight AI — Your money, in focus</title>
    <script>
      // Anti-FOUC: apply the saved theme class before first paint. Must mirror
      // src/context/ThemeContext.tsx's class logic exactly — if the two ever
      // diverge, the page will flash the wrong theme on load.
      (function () {
        try {
          var saved = localStorage.getItem('finsight_theme');
          var theme = saved === 'dark-fintech' ? 'dark-fintech' : 'light-professional';
          var root = document.documentElement;
          root.classList.add(theme);
          root.style.colorScheme = theme === 'light-professional' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.classList.add('light-professional');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
