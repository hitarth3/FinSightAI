# A generic, single-database configuration.

[alembic]
# path to migration scripts
script_location = %(here)s/alembic

# Resolve application imports relative to this configuration file.
prepend_sys_path = %(here)s

# version path separator; defaults to ';'
version_path_separator = os

# database url
sqlalchemy.url = postgresql+asyncpg://postgres:password@localhost:5432/finsight

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
